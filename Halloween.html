<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Class Period • Active Directory • Halloween</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@500;600;700;800;900&family=Exo+2:wght@400;500;600;700&display=swap');

:root {
  --orange: #ff9c3a;
  --orange-soft: #ffd08a;
  --purple: #b36cff;
  --cream: #fff3df;
  --glass: rgba(18, 7, 27, .34);
  --glass-2: rgba(33, 11, 38, .24);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  background: #100613;
  color: var(--cream);
  display: grid;
  place-items: center;
  font-family: 'Exo 2', sans-serif;
}

#bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(.56) contrast(1.12) saturate(1.12);
  transform: scale(1.04);
  z-index: -10;
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: -9;
  background:
    radial-gradient(circle at 50% 48%, rgba(255, 134, 29, .10), transparent 36%),
    radial-gradient(circle at 12% 16%, rgba(176, 81, 255, .18), transparent 28%),
    radial-gradient(circle at 90% 80%, rgba(255, 112, 22, .13), transparent 26%),
    linear-gradient(180deg, rgba(16, 4, 25, .20), rgba(9, 3, 13, .62));
  pointer-events: none;
}

.scan {
  position: fixed;
  inset: 0;
  z-index: 8;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0 5px,
    rgba(255, 204, 141, .045) 6px
  );
  opacity: .48;
  pointer-events: none;
  animation: scan 9s linear infinite;
}

.date {
  position: fixed;
  top: 26px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 7;
  padding: 12px 24px 13px;
  border: 1px solid rgba(255, 173, 81, .38);
  border-radius: 999px;
  background: rgba(26, 8, 24, .30);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  color: #fff2dc;
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(10px, 1.05vw, 15px);
  font-weight: 600;
  letter-spacing: 2.2px;
  white-space: nowrap;
  text-shadow: 0 0 14px rgba(255, 155, 54, .78);
  box-shadow:
    0 0 34px rgba(255, 115, 22, .14),
    inset 0 1px 0 rgba(255, 240, 215, .12);
}

.card {
  position: relative;
  isolation: isolate;
  width: min(1080px, 91vw);
  padding: clamp(58px, 7vw, 84px) clamp(28px, 5vw, 64px);
  text-align: center;
  border: 1px solid rgba(255, 155, 61, .45);
  border-radius: 32px;
  background:
    radial-gradient(circle at 50% 0%, rgba(255, 142, 35, .10), transparent 43%),
    radial-gradient(circle at 86% 100%, rgba(168, 87, 255, .10), transparent 34%),
    linear-gradient(135deg, var(--glass), var(--glass-2));
  backdrop-filter: blur(15px) saturate(150%);
  -webkit-backdrop-filter: blur(15px) saturate(150%);
  box-shadow:
    0 32px 110px rgba(0,0,0,.64),
    0 0 0 1px rgba(177, 95, 255, .08),
    0 0 95px rgba(255, 106, 22, .12),
    inset 0 1px 0 rgba(255, 227, 192, .12),
    inset 0 -32px 74px rgba(102, 39, 142, .10);
  overflow: hidden;
  animation: float 6s ease-in-out infinite;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: -45%;
  width: 36%;
  height: 100%;
  transform: skewX(-22deg);
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255, 220, 173, .15),
    transparent
  );
  filter: blur(2px);
  animation: shine 6.4s linear infinite;
  pointer-events: none;
}

.card::after {
  content: "";
  position: absolute;
  left: 10%;
  right: 10%;
  bottom: 20px;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255, 165, 74, .36),
    rgba(180, 96, 255, .30),
    transparent
  );
  box-shadow: 0 0 20px rgba(255, 130, 40, .18);
  pointer-events: none;
}

.title {
  display: block;
  position: relative;
  z-index: 2;
  font-family: 'Audiowide', 'Orbitron', sans-serif;
  font-size: clamp(38px, 6.45vw, 84px);
  line-height: 1.08;
  font-weight: 400;
  letter-spacing: clamp(2px, .38vw, 6px);
  text-transform: uppercase;
  color: #fff4df;
  text-shadow:
    0 0 8px rgba(255,247,232,.96),
    0 0 22px rgba(255, 151, 45, .76),
    0 0 52px rgba(174, 78, 255, .38);
  animation: titleGlow 3.5s ease-in-out infinite;
}

.title-line {
  display: block;
  font: inherit;
  line-height: inherit;
}

.title-line + .title-line { margin-top: .18em; }

.pumpkin-sticker {
  position: fixed;
  right: clamp(14px, 4vw, 62px);
  bottom: clamp(16px, 4.5vw, 62px);
  width: clamp(92px, 11vw, 150px);
  z-index: 6;
  pointer-events: none;
  filter: drop-shadow(0 0 16px rgba(255, 116, 29, .32));
  animation: stickerFloat 4.8s ease-in-out infinite;
  transform-origin: 50% 70%;
}

.pumpkin-sticker svg { width: 100%; height: auto; display: block; }

.pumpkin {
  fill: #ff8a25;
  stroke: #5a1d18;
  stroke-width: 5;
}

.pumpkin-back { fill: #f47c20; }
.pumpkin-left { fill: #ff922e; }
.pumpkin-right { fill: #ff9b35; }

.ridge {
  fill: none;
  stroke: rgba(133, 42, 19, .44);
  stroke-width: 6;
  stroke-linecap: round;
}

.stem { fill: #5b3a18; }
.leaf { fill: #6f9b38; stroke: #41261b; stroke-width: 4; }

.face {
  fill: #341425;
  stroke: none;
}

.sticker-shadow {
  fill: rgba(0,0,0,.26);
  transform-origin: center;
  animation: shadowPulse 4.8s ease-in-out infinite;
}

.orb {
  position: fixed;
  border: 1px solid rgba(199, 126, 255, .14);
  border-radius: 50%;
  pointer-events: none;
  z-index: -2;
  box-shadow:
    inset 0 0 55px rgba(193, 103, 255, .07),
    0 0 48px rgba(255, 130, 47, .07);
}

.o1 {
  width: 220px;
  height: 220px;
  left: 4%;
  top: 15%;
  animation: o1 12s ease-in-out infinite;
}

.o2 {
  width: 290px;
  height: 290px;
  right: 3%;
  bottom: 8%;
  animation: o2 15s ease-in-out infinite;
}

.spark {
  position: fixed;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255, 181, 92, .85);
  box-shadow: 0 0 14px rgba(255, 140, 38, .70);
  z-index: 4;
  pointer-events: none;
  animation: sparkle 3.8s ease-in-out infinite;
}

.s1 { left: 13%; top: 24%; animation-delay: .4s; }
.s2 { right: 14%; top: 31%; width: 4px; height: 4px; animation-delay: 1.3s; }
.s3 { left: 20%; bottom: 19%; width: 4px; height: 4px; animation-delay: 2.1s; }

@keyframes scan { to { transform: translateY(12px); } }
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}
@keyframes shine {
  0%, 52% { left: -45%; }
  78%, 100% { left: 145%; }
}
@keyframes titleGlow {
  0%,100% {
    text-shadow:
      0 0 8px rgba(255,247,232,.96),
      0 0 22px rgba(255,151,45,.68),
      0 0 52px rgba(174,78,255,.32);
  }
  50% {
    text-shadow:
      0 0 11px rgba(255,252,242,1),
      0 0 32px rgba(255,163,61,.90),
      0 0 72px rgba(181,85,255,.48);
  }
}
@keyframes stickerFloat {
  0%,100% { transform: translate3d(0,0,0) rotate(-4deg) scale(1); }
  50% { transform: translate3d(-12px,-18px,0) rotate(5deg) scale(1.035); }
}
@keyframes shadowPulse {
  0%,100% { transform: scaleX(.92); opacity: .24; }
  50% { transform: scaleX(.72); opacity: .12; }
}
@keyframes sparkle {
  0%,100% { opacity: .15; transform: translateY(0) scale(.8); }
  50% { opacity: .95; transform: translateY(-12px) scale(1.2); }
}
@keyframes o1 {
  50% { transform: translate(75px, 42px) scale(1.05); }
}
@keyframes o2 {
  50% { transform: translate(-75px, -42px) scale(.96); }
}

@media (max-width: 700px) {
  .card {
    width: 92vw;
    padding: 58px 22px 64px;
    border-radius: 26px;
  }
  .date {
    top: 18px;
    padding: 10px 17px;
    letter-spacing: 1.6px;
  }
  .title {
    font-size: clamp(32px, 9.2vw, 58px);
    letter-spacing: 2px;
  }
  .pumpkin-sticker { opacity: .92; }
  .o1, .o2 { opacity: .6; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
}
</style>
